name: Update published articles

# Post-publication improvements. Does nothing unless updates are explicitly enabled
# (updates.enabled: true in config/settings.yaml or repository variable BOT_UPDATES_ENABLED=true).
on:
  workflow_dispatch:
    inputs:
      article_id:
        description: Article id to update (empty = oldest article due for a check)
        default: ""
      dry_run:
        type: boolean
        default: true
  schedule:
    - cron: "17 9 * * 2"   # Tuesdays 09:17 UTC

concurrency:
  group: typo3-publisher-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BOT_STATE_BACKEND: git_branch
      BOT_LOG_FORMAT: json
      # Summary and articles of the run (also on dry runs) for the control panel, kept in the bot-runs branch.
      BOT_RESULT_FILE: ${{ github.workspace }}/bot-result.json
      BOT_PAUSED: ${{ vars.BOT_PAUSED }}
      BOT_PUBLISHING_ENABLED: ${{ vars.BOT_PUBLISHING_ENABLED }}
      BOT_UPDATES_ENABLED: ${{ vars.BOT_UPDATES_ENABLED }}
      TYPO3_BACKEND_URL: ${{ secrets.TYPO3_BACKEND_URL }}
      TYPO3_USERNAME: ${{ secrets.TYPO3_USERNAME }}
      TYPO3_PASSWORD: ${{ secrets.TYPO3_PASSWORD }}
      TYPO3_STORAGE_STATE: ${{ secrets.TYPO3_STORAGE_STATE }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      WEBSITE_BASE_URL: ${{ secrets.WEBSITE_BASE_URL }}
      # Website id of the campus a article form (profile campus_frontend), e.g. campus-a-college.
      WEBSITE_ID: ${{ secrets.WEBSITE_ID || vars.WEBSITE_ID }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bot
      - name: Run update
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
          DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry_run && '--dry-run' || '' }}
        run: python -m typo3_publisher run --mode update $DRY_RUN --article-id "$ARTICLE_ID"
      - name: Save the result for the control panel
        if: always()
        uses: ./.github/actions/save-result
        with:
          file: ${{ env.BOT_RESULT_FILE }}

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({ ...context.repo, title: 'TYPO3 publisher: update run failed',
              body: `See ${url}`, labels: ['bot-failure'] });
