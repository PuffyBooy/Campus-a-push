name: Generate and review

# LLM-only work (no TYPO3 access): build a backlog of reviewed articles that the publish
# workflow (mode publish-approved, or scheduled with prefer_approved_backlog) can publish later.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: prepare
        options: [prepare, generate-only, review-only]
      idea:
        default: ""
      topic:
        default: ""
      count:
        description: Number of drafts (generate-only)
        default: "1"
      article_id:
        description: Review a single draft (review-only)
        default: ""
  # schedule:
  #   - cron: "23 4 * * 1"   # Mondays: prepare articles for the week

concurrency:
  group: typo3-publisher-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_STATE_BACKEND: git_branch
      BOT_LOG_FORMAT: json
      # Summary and articles of the run (also on dry runs) for the control panel, kept in the bot-runs branch.
      BOT_RESULT_FILE: ${{ github.workspace }}/bot-result.json
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WEBSITE_BASE_URL: ${{ secrets.WEBSITE_BASE_URL }}
      # Website id of the campus a article form (profile campus_frontend), e.g. campus-a-college.
      WEBSITE_ID: ${{ secrets.WEBSITE_ID || vars.WEBSITE_ID }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bot
        with:
          browser: "false"
      - name: Run
        env:
          MODE: ${{ inputs.mode || 'prepare' }}
          IDEA: ${{ inputs.idea }}
          TOPIC: ${{ inputs.topic }}
          COUNT: ${{ inputs.count || '1' }}
          ARTICLE_ID: ${{ inputs.article_id }}
        run: python -m typo3_publisher run --mode "$MODE" --idea "$IDEA" --topic "$TOPIC" --count "$COUNT" --article-id "$ARTICLE_ID"

      - name: Save the result for the control panel
        if: always()
        uses: ./.github/actions/save-result
        with:
          file: ${{ env.BOT_RESULT_FILE }}
