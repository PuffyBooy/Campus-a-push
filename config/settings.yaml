# Central configuration of the TYPO3 publishing bot.
# Secrets (passwords, API keys) are NEVER stored here - they come from GitHub Actions secrets.
# Environment overrides: WEBSITE_ID, TYPO3_BACKEND_URL, WEBSITE_BASE_URL, BOT_PUBLISHING_ENABLED, BOT_PAUSED,
# BOT_UPDATES_ENABLED, BOT_STATE_BACKEND, CHROMIUM_EXECUTABLE, BOT_HEADLESS.

website:
  base_url: ""              # set via the WEBSITE_BASE_URL secret
  name: "campus a college"  # used as {{site_name}} in the editorial prompt
  language: de              # language of the articles
  public_url:
    # How to find the public article URL after publishing:
    #   pattern               build it from the slug (path_segment) read back from TYPO3
    #   listing               search the news list page for a link with the article title
    #   pattern_then_listing  try both
    #   backend_view          use the URL of the backend "View" button
    strategy: pattern_then_listing
    pattern: "{base_url}/news/{slug}"
    listing_url: "{base_url}/news"
  verification:
    attempts: 6
    initial_delay_seconds: 10
    backoff_factor: 2.0
    max_delay_seconds: 120
    timeout_seconds: 30
    min_title_similarity: 0.85
    min_content_overlap: 0.5

typo3:
  backend_url: ""           # set via the TYPO3_BACKEND_URL secret, e.g. https://www.example.org/typo3
  # campus_frontend: campus a author pages, saves drafts only (see the campus section below)
  # news (EXT:news) | content_element (page + text/media element): TYPO3 backend
  profile: campus_frontend
  selectors_file: config/typo3_selectors.yaml
  storage_state_env: TYPO3_STORAGE_STATE
  browser:
    headless: true
    executable_path: ""     # optional; CHROMIUM_EXECUTABLE overrides
    navigation_timeout_ms: 45000
    action_timeout_ms: 15000
    upload_timeout_ms: 120000
    slow_mo_ms: 0
    viewport_width: 1600
    viewport_height: 1000
    locale: de-AT

llm:
  # mistral: Mistral API (key in the MISTRAL_API_KEY secret). Models: https://docs.mistral.ai/models
  # groq:    Groq (GROQ_API_KEY), e.g. writer/editor openai/gpt-oss-120b with reasoning_effort: low,
  #          image model qwen/qwen3.8-27b. Free tier: only 8000 tokens per minute, 200000 per day.
  # openai:  OpenAI (OPENAI_API_KEY)
  provider: mistral
  base_url: ""              # empty = provider default
  api_key_env: ""           # empty = MISTRAL_API_KEY / GROQ_API_KEY / OPENAI_API_KEY
  writer_model: mistral-large-latest
  editor_model: mistral-large-latest
  writer_temperature: 0.7
  editor_temperature: 0.2   # set to null for models that do not accept a temperature
  max_output_tokens: 8000
  timeout_seconds: 180
  reasoning_effort: ""      # low | medium | high for reasoning models (gpt-oss); Mistral Large: empty
  # Rate limits (HTTP 429): wait as long as the provider asks (or rate_limit_default_wait_seconds if it
  # does not say). A longer wait than rate_limit_max_wait_seconds (e.g. a daily limit) ends the run.
  rate_limit_retries: 8
  rate_limit_max_wait_seconds: 120
  rate_limit_default_wait_seconds: 20

editorial:
  prompt_file: config/editorial_prompt.md
  review_rubric_file: config/review_rubric.md
  # The editor gets this short checklist instead of the full writer prompt (saves ~3000 tokens per review,
  # needed for Groq's free tier of 8000 tokens per minute). Empty = full editorial_prompt.md.
  review_checklist_file: config/review_checklist.md
  # Draft mode: you complete each draft (own reporting, real quotes, final headline) before publishing.
  # Missing own reporting then becomes a to-do in the run summary instead of a reason to reject.
  draft_mode: true
  quality_threshold: 8.0    # weighted score (0-10) required for approval
  min_criterion_score: 6.0  # every single criterion must reach this
  min_factual_score: 7.0
  max_revision_cycles: 3
  criteria_weights:
    factual_accuracy: 3.0
    readability: 1.0
    structure: 1.0
    grammar: 1.0
    seo: 1.0
    relevance: 1.5
    originality: 1.0
    clarity: 1.0
    instruction_adherence: 1.5
  # Draft length. editorial_prompt.md asks for ~7000 characters in the finished text; your own reporting
  # (quotes, survey, scene) adds to the draft. With only two sources the model reaches ~600-900 words.
  min_words: 550
  max_words: 1100
  word_count_tolerance: 0.1
  max_title_length: 90
  meta_description_min: 110
  meta_description_max: 155  # campus a form limit
  forbidden_terms: []
  require_sources_for_factual: true
  duplicate_title_similarity: 0.82
  duplicate_content_similarity: 0.45
  recent_titles_context: 40

research:
  enabled: true             # facts come only from articles fetched from these sources
  approved_domains: [orf.at, derstandard.at, diepresse.com, kurier.at, statistik.at]
  feeds:                    # RSS/Atom feeds on approved domains; items are matched to the topic keywords
    - https://rss.orf.at/news.xml
    - https://rss.orf.at/oesterreich.xml
    - https://rss.orf.at/wien.xml
    - https://rss.orf.at/science.xml
    - https://rss.orf.at/help.xml
    - https://www.derstandard.at/rss/inland
    - https://www.derstandard.at/rss/wissenschaft
    - https://www.derstandard.at/rss/wirtschaft
    - https://www.derstandard.at/rss/kultur
    - https://www.derstandard.at/rss/web
    - https://www.diepresse.com/rss
    - https://kurier.at/xml/rss
  # Kept small on purpose: every source is sent to the writer and the editor, and Groq's free tier allows
  # only 8000 tokens per minute per request. Raise both with a paid plan.
  max_sources: 2
  max_chars_per_source: 2200
  min_keyword_matches: 1
  timeout_seconds: 20

images:
  provider: pixabay
  required: true            # true: never publish without a suitable image
  search_language: en
  min_width: 1200
  min_aspect_ratio: 1.3
  min_relevance: 0.34
  per_page: 50
  max_queries: 4
  safesearch: true
  exclude_people: true      # avoid identifiable persons (Pixabay Content License restrictions)
  download_dir: artifacts/images
  max_file_mb: 15
  text:                     # caption (Bildtext) + description/alt text (Bildbeschreibung)
    mode: vision            # vision: the model looks at the downloaded image | tags: templates only
    # Must accept image input. Mistral Large is multimodal; on Groq use qwen/qwen3.8-27b.
    # Empty = llm.writer_model.
    model: mistral-large-latest
    caption_max_chars: 200
    description_max_chars: 250
    caption_fallback: "Symbolbild: {tags}"
    description_fallback: "{tags}"
    max_image_mb: 4
  attribution:              # copyright line from Pixabay
    enabled: true
    template: "© {user} / Pixabay"
    target: caption         # caption (image fields, see typo3_selectors.yaml) | body | both

publishing:
  enabled: false            # MASTER SWITCH. Enable only after discovery + a verified test publication.
  auto_publish: true        # false: approved articles wait for a manual "publish-approved" run
  timezone: Europe/Vienna
  slots:                    # one draft per weekday; the weekly quotas in topics.yaml cap the total
    - days: [mon, tue, wed, thu, fri]
      times: ["12:00"]
  slot_grace_minutes: 150   # how late a delayed GitHub run may still serve a slot
  catch_up: latest_only     # latest_only: serve only the most recent missed slot | none
  max_articles_per_run: 1
  max_publish_attempts: 3
  max_generation_attempts: 2
  prefer_approved_backlog: true
  default_categories: []
  categories_by_topic: {}   # e.g. {"Artificial Intelligence": ["KI"]}
  allow_test_content: false # never set to true for the live site

updates:
  enabled: false            # post-publication updates only run when explicitly enabled
  min_age_days: 30
  max_updates_per_run: 1
  update_if_score_below: 7.5
  preserve_links: true
  max_versions_kept: 20

state:
  backend: local            # GitHub Actions sets BOT_STATE_BACKEND=git_branch
  local_dir: data
  git_branch: bot-state
  git_dir: .bot-state
  git_remote: origin
  lock_ttl_minutes: 120

retries:
  llm: {attempts: 4, base_delay_seconds: 2, max_delay_seconds: 30}
  http: {attempts: 3, base_delay_seconds: 2, max_delay_seconds: 30}
  browser: {attempts: 2, base_delay_seconds: 5, max_delay_seconds: 30}
  git: {attempts: 5, base_delay_seconds: 2, max_delay_seconds: 30}

diagnostics:
  directory: artifacts/diagnostics
  screenshots: true
  html_dumps: true

notifications:
  webhook_env: NOTIFY_WEBHOOK_URL
  notify_on: [failure, rejected, published, draft_saved]

# Profile campus_frontend (typo3.profile). Logs in with the author account (TYPO3_USERNAME = e-mail,
# TYPO3_PASSWORD) on the website itself - no TYPO3 backend. Approved articles are saved with
# "Als Entwurf speichern" and marked as AI-assisted; the bot never clicks "Veröffentlichen".
# You review, edit and publish each draft yourself on the website.
campus:
  site_id: ""               # set via WEBSITE_ID (secret or variable), e.g. campus-a-college
  base_url: ""              # empty: WEBSITE_BASE_URL, else the known address of site_id
  default_resort: Panorama  # Kultur | Panorama | Politik | Sport | Wirtschaft | Wissenschaft
  resort_by_topic:          # topic (topics.yaml) -> Ressort of the form
    Politik: Politik
    Wirtschaft: Wirtschaft
    Wissenschaft: Wissenschaft
    Panorama: Panorama
    Kultur: Kultur
  default_region: Österreich
  region_by_topic: {}
  max_tags: 5               # the site allows 5
  create_missing_tags: true # create a tag when no existing tag has the same name
  # Tick the two image confirmations only for Pixabay images without people (images.exclude_people).
  confirm_image_rights: true
